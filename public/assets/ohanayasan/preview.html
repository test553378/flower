<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>おはなやさん 素材プレビュー</title><style>
*{box-sizing:border-box}body{background:#fff6fb;color:#643a5c;font-family:system-ui,"Hiragino Kaku Gothic ProN",sans-serif;margin:0;padding:20px}h1{font-size:24px}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}.tile{border:2px solid #f0cae1;background:white;border-radius:16px;padding:10px;text-align:center}.tile img{width:100%;height:140px;object-fit:contain}.tile small{word-break:break-all}#stage{height:310px;border-radius:20px;overflow:hidden;background:#fbecfc url(backgrounds/shop_interior.png) center/cover;display:flex;justify-content:center;align-items:center}#bouquet{position:relative;width:260px;height:290px}#bouquet .stem{position:absolute;width:115px;height:170px;object-fit:contain;transform-origin:50% 85%;top:12px;left:73px}#wrap{position:absolute;width:220px;height:175px;left:20px;top:90px;object-fit:contain}#ribbon{position:absolute;width:94px;height:94px;left:83px;top:194px;object-fit:contain}button{margin:4px;padding:12px;border:2px solid #e59bcc;border-radius:12px;background:white}p{line-height:1.6}select{font-size:17px;padding:8px}</style></head><body>
<h1>おはなやさん 画像素材プレビュー</h1><p>このページは画像の確認用です。完成したゲームではありません。10本までの花束を合成するためのレイヤー配置例です。</p>
<label>おはな <select id="flower"></select></label><label>ほうそうし <select id="paper"></select></label><label>リボン <select id="bow"></select></label><button id="add">おはなを ついか</button><button id="undo">ひとつ もどす</button><button id="reset">ぜんぶ けす</button>
<div id="stage"><div id="bouquet"></div></div><h2>しゅるいべつ いちらん</h2><div class="gallery" id="gallery"></div>
<script>
const flowers=['tulip_red','tulip_yellow','rose_pink','rose_white','sunflower_yellow','gerbera_white','gerbera_orange','cosmos_purple','marguerite_white','carnation_pink'];
const papers=['pink','lightblue','yellow','purple','green'],bows=['red','pink','yellow','lightblue','purple'];
const f=document.getElementById('flower'),p=document.getElementById('paper'),r=document.getElementById('bow'),canvas=document.getElementById('bouquet');
function fill(el,opts){opts.forEach(x=>{let o=document.createElement('option');o.value=x;o.textContent=x;el.append(o);});}fill(f,flowers);fill(p,papers);fill(r,bows);let stems=[];
function render(){canvas.innerHTML='';const count=stems.length;stems.forEach((x,i)=>{let img=document.createElement('img');img.className='stem';img.src='flowers/'+x+'.png';img.style.left=(73+(i-(count-1)/2)*17)+'px';img.style.top=(11+Math.abs(i-(count-1)/2)*3)+'px';img.style.transform='rotate('+((i-(count-1)/2)*8)+'deg)';canvas.append(img)});
if(count>=2){let wrap=document.createElement('img');wrap.id='wrap';wrap.src='wrapping/paper_'+p.value+'.png';canvas.append(wrap);let rib=document.createElement('img');rib.id='ribbon';rib.src='wrapping/ribbon_'+r.value+'.png';canvas.append(rib)} }
document.getElementById('add').onclick=()=>{if(stems.length<10){stems.push(f.value);render();}};
document.getElementById('undo').onclick=()=>{stems.pop();render()};document.getElementById('reset').onclick=()=>{stems=[];render()};p.onchange=render;r.onchange=render;
const gallery=document.getElementById('gallery');let srcs=[...flowers.map(x=>'flowers/'+x+'.png'),...papers.map(x=>'wrapping/paper_'+x+'.png'),...bows.map(x=>'wrapping/ribbon_'+x+'.png'),'characters/player/fullbody_welcome.png','characters/player/smile.png','characters/player/happy.png','characters/player/trouble.png',...['girl_orange','girl_blue','boy_green','boy_glasses'].map(x=>'characters/customers/'+x+'_smile.png')];srcs.forEach(path=>{let d=document.createElement('div');d.className='tile';let img=document.createElement('img');img.src=path;let cap=document.createElement('small');cap.textContent=path;d.append(img,cap);gallery.append(d)});render();
</script></body></html>
